description = """
Convoy entry point for work beads that need no build plan: bugfixes and small
changes to an existing project. Each bead becomes one task card and runs the
tiered loop of superpowers-lite-work-item in its own sessions and worktree,
then lands on its target branch: the bead's `target`, else the convoy's, else
`lite/<bead id>`. Beads sharing a target must be ordered with blocks edges, or
later ones are refused at land.
"""
formula = "superpowers-lite-work"
version = 2
contract = "graph.v2"
target_required = true

[catalog]
name = "superpowers-lite-work"
description = "Drain work beads through card cutting, tiered attempts, checks, one review and a compare-and-swap land."

[[steps]]
id = "drain"
title = "Drain work beads, one item workflow each"
metadata = { "gc.run_target" = "superpowers-lite.operator" }

[steps.drain]
context = "separate"
formula = "superpowers-lite-work-item"
member_access = "exclusive"
