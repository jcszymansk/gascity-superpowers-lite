description = """
One work bead with no build plan (a bugfix or a small change to an existing
project): superpowers TDD steps, the single-reviewer task review, then a land
step that moves the item's target branch by compare-and-swap. The bead is the
specification. Drained by superpowers-lite-work.
"""
formula = "superpowers-lite-work-item"
version = 1
contract = "graph.v2"
extends = ["superpowers-lite-development"]
target_required = true

# Bases the worktree on the item's target branch when it exists, so items
# sharing a target stack, and records the target and base for the land step.
[[steps]]
id = "prepare-worktree"
title = "Prepare item worktree on its target branch"
metadata = { "gc.run_target" = "gc.run-operator" }
description_file = "../assets/workflows/superpowers-lite-work-item/prepare-worktree.md"

# The upstream text reads the approved requirements and plan; here the bead is
# the whole specification.
[[steps]]
id = "implement"
title = "Inspect the work bead"
needs = ["prepare-worktree"]
metadata = { "gc.run_target" = "{{implementation_target}}", "gc.continuation_group" = "superpowers-task-{{issue}}", "gc.build.artifact_schema" = "gc.build.implementation-summary.v1", "gc.build.artifact_path_keys" = "gc.implementation.summary_path,gc.build.implementation_summary_path,gc.var.summary_path" }
description_file = "../assets/workflows/superpowers-lite-work-item/implement.md"

[steps.check]
max_attempts = 3

[steps.check.check]
mode = "exec"
path = ".gc/scripts/checks/build-artifact-valid.sh"
timeout = "5m"

[[steps]]
id = "record-item-result"
title = "Record and commit the item result"
needs = ["task-review"]
metadata = { "gc.run_target" = "{{implementation_target}}", "gc.continuation_group" = "superpowers-task-{{issue}}" }
description_file = "../assets/workflows/superpowers-lite-work-item/record-item-result.md"

# The workflow reaches this step whatever the review's outcome, so the review
# gate lives in the step's commands.
[[steps]]
id = "land"
title = "Land the item on its target branch"
needs = ["record-item-result"]
metadata = { "gc.run_target" = "gc.run-operator" }
description_file = "../assets/workflows/superpowers-lite-work-item/land.md"

[[steps]]
id = "close-source-anchor"
title = "Close the work bead"
needs = ["land"]
metadata = { "gc.run_target" = "gc.run-operator" }
description_file = "../assets/workflows/superpowers-lite-work-item/close-source-anchor.md"
