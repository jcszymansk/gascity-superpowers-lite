description = """
One work bead through the lite v2 loop: prepare its worktree, cut one task
card, run a T1 attempt and verify it. The verify step's output picks what
follows (superpowers-lite-next): land, a T2 attempt, a human-approved T3
attempt, or nothing when the item is blocked. Drained by superpowers-lite-work.
"""
formula = "superpowers-lite-work-item"
version = 2
contract = "graph.v2"
target_required = true

[[steps]]
id = "prepare-worktree"
title = "Prepare the item worktree on its target branch"
metadata = { "gc.run_target" = "superpowers-lite.operator", "lite.step" = "prepare-worktree" }
description_file = "../assets/workflows/superpowers-lite-work-item/prepare-worktree.md"

[[steps]]
id = "cut-card"
title = "Cut the task card for {{issue}}"
needs = ["prepare-worktree"]
metadata = { "gc.run_target" = "superpowers-lite.card-cutter", "lite.step" = "cut-card" }
description_file = "../assets/workflows/superpowers-lite-work-item/cut-card.md"

[[steps]]
id = "attempt-t1"
title = "T1 attempt for {{issue}}"
needs = ["cut-card"]
metadata = { "gc.run_target" = "superpowers-lite.executor-t1", "lite.step" = "attempt", "lite.tier" = "t1" }
description_file = "../assets/workflows/superpowers-lite-work-item/attempt.md"

# The verdict, not a model, decides what follows: verify writes
# gc.output_json = {"next": [{"action": "land" | "t2"}]} and this bonds one
# superpowers-lite-next fragment per entry. land lives in the fragment because
# an authored step cannot need the generated verify-t1-fanout control.
[[steps]]
id = "verify-t1"
title = "Verify the T1 attempt for {{issue}}"
needs = ["attempt-t1"]
metadata = { "gc.run_target" = "superpowers-lite.card-reviewer", "lite.step" = "verify", "lite.tier" = "t1" }
description_file = "../assets/workflows/superpowers-lite-work-item/verify.md"

[steps.on_complete]
for_each = "output.next"
bond = "superpowers-lite-next"
vars = { action = "{item.action}", issue = "{{issue}}" }
sequential = true
